name: Build and deploy VARETHON ASCEND

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inject public runtime configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node -e "const fs=require('fs'); const url=process.env.SUPABASE_URL || 'https://qphzagsrntgjktnqiyaz.supabase.co'; const key=process.env.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_Itiu9sPDNN60lfSExFkuWw_HvU5x47e'; fs.writeFileSync('public/runtime-config.js', 'window.__VARETHON_CONFIG__ = ' + JSON.stringify({supabaseUrl:url,supabasePublishableKey:key}) + ';\\n');"
      - name: Resolve GitHub Pages base href
        id: pages-path
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi
      - name: Build production bundle
        run: npm run build -- --configuration production --base-href="${{ steps.pages-path.outputs.base }}"
      - name: Verify artifact and deep-link fallback
        run: |
          test -f dist/varethon-ascend/index.html
          cp dist/varethon-ascend/index.html dist/varethon-ascend/404.html
          test -f dist/varethon-ascend/404.html
          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_DB_PASSWORD|GEMINI_API_KEY=[A-Za-z0-9_-]{12,}|ghp_[A-Za-z0-9]{20,}' dist/varethon-ascend; then exit 1; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/varethon-ascend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
