name: Build and deploy VARETHON ASCEND

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve GitHub Pages base href
        id: pages-path
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi
      - name: Build production bundle
        run: npm run build -- --configuration production --base-href="${{ steps.pages-path.outputs.base }}"
      - name: Verify artifact and deep-link fallback
        run: |
          test -f dist/varethon-ascend/browser/index.html
          test -f dist/varethon-ascend/browser/courses/manifest.json
          test "$(find dist/varethon-ascend/browser/courses -type f -name '*.mp4' | wc -l)" -ge 1
          test "$(find dist/varethon-ascend/browser/courses -type f -name '*.mp4' -size +1M | wc -l)" -ge 1
          cp dist/varethon-ascend/browser/index.html dist/varethon-ascend/browser/404.html
          test -f dist/varethon-ascend/browser/404.html
          if grep -R -n --include='*.js' --include='*.css' --include='*.html' -E 'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_DB_PASSWORD|GEMINI_API_KEY=[A-Za-z0-9_-]{12,}|ghp_[A-Za-z0-9]{20,}|AIzaSy[A-Za-z0-9_-]{20,}' dist/varethon-ascend/browser; then exit 1; fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/varethon-ascend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
